# 푸시할 때마다 public/ 폴더를 GitHub Pages로 배포 → https://tvttvvv.github.io/web-game/
name: Deploy GitHub Pages
on:
  push:
    branches: [ccr-2b16abba-nayabb]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - id: deploy
        uses: actions/deploy-pages@v4
