<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#14202e">
<title>픽셀 커먼스</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="hp"></div>
  <div id="inv"><span id="wood">🪵 0</span><span id="stone">🪨 0</span><span id="kills">💀 0</span></div>
  <div id="info"><span id="clock">☀️</span><span id="online">👥 1</span><span id="zone"></span></div>
</div>
<div id="chatlog"></div>
<div id="topright">
  <button id="btnChat" class="sq" aria-label="채팅">💬</button>
  <button id="btnFull" class="sq" aria-label="전체화면">⛶</button>
</div>
<form id="chatForm" autocomplete="off" hidden>
  <input id="chatInput" maxlength="60" placeholder="메시지 (최대 60자)">
  <button type="submit">전송</button>
</form>

<div id="joy"><div id="knob"></div></div>
<div id="palette" hidden></div>
<div id="actions">
  <button id="btnMode" class="big">⛏️<small>채집</small></button>
  <button id="btnAtk" class="big atk">⚔️<small>공격</small></button>
</div>
<div id="toast"></div>
<div id="banner"></div>

<div id="login">
  <form id="loginForm" autocomplete="off">
    <h1>픽셀 커먼스</h1>
    <p class="sub">모두가 함께 사는 공개월드 · 협동 PvE 샌드박스</p>
    <label for="nick">닉네임 (게스트)</label>
    <input id="nick" maxlength="12" placeholder="예: 토끼" required>
    <button type="submit" id="enter">입장하기</button>
    <p id="loginMsg" class="msg"></p>
    <ul class="tips">
      <li>왼쪽 아래 조이스틱으로 이동</li>
      <li>⛏️ 채집 모드: 나무·바위를 터치해서 캐기</li>
      <li>🧱 건축 모드: 땅을 터치해서 블록 놓기 (물 위엔 바닥 → 다리!)</li>
      <li>🚩 깃발을 세우면 내 땅! 남은 못 건드려요</li>
      <li>🌙 밤에는 슬라임이 몰려와요 — 벽을 세우고 같이 막아요</li>
    </ul>
  </form>
</div>
<script type="module" src="js/main.js"></script>
</body>
</html>
